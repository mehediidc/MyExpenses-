name: Build MyExpenses APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Install Android platform
        run: cordova platform add android@13.0.0

      - name: Build release APK
        run: cordova build android --release

      - name: Find APK
        run: find platforms/android/app/build/outputs/apk/release -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-APK
          path: platforms/android/app/build/outputs/apk/release/*.apk
