name: Fast Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create myApp com.mhdigital.myexpenses MyExpenses
          cd myApp
          rm -rf www/*
          cp -R ../. www/
          # Ensure workflow file is not copied inside www
          rm -rf www/.github
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-Offline-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          import React from 'react';
          import { SafeAreaView } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            return (
              <SafeAreaView style={{flex: 1}}>
                <WebView
                  source={{ uri: 'file:///android_asset/index.html' }}
                  allowFileAccess={true}
                  allowUniversalAccessFromFileURLs={true}
                  domStorageEnabled={true}
                  javaScriptEnabled={true}
                  originWhitelist={['*']}
                />
              </SafeAreaView>
            );
          }
          EOF
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-Offline-APK
          path: OfflineApp/android/app/build/outputs/apk/debug/app-debug.apk

