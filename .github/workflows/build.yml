name: Fast Offline APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.mhdigital.myexpenses MyExpenses
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' ./ app/www/
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-Offline-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
